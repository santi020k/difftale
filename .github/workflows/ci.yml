name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate (22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.22.3

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Build
        run: pnpm run build

      - name: Run checks
        run: pnpm exec turbo run typecheck lint test:coverage

      - name: Package extension
        run: pnpm run package:extension

  report-dispatched-validation:
    name: Report dispatched validation
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Report successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context='Build and validate (22.x)'
          -f description='Dispatched release validation passed'
